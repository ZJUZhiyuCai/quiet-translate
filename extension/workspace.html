<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>长文翻译 · 轻译</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="workspace.css"></head><body>
<header class="page-header"><a class="brand" href="workspace.html"><span class="logo"><img src="icons/48.png" alt=""></span><span class="wordmark">轻译<small>QUIET TRANSLATE</small></span></a><nav class="nav" aria-label="主要导航"><a href="workspace.html" aria-current="page">长文翻译</a><a href="options.html">偏好设置</a></nav></header>
<main class="workspace">
<div class="workspace-heading"><div class="heading-main"><h1>长一点，也从容。</h1><p>一段文章，一封来信，或一个更大的世界。</p></div><div class="model-label"><span class="status-dot"></span><span id="model"></span><small>流式翻译 · 自动分段</small></div></div>
<div id="setup" class="setup-hint" hidden><div class="setup-copy"><strong>尚未连接翻译服务</strong><span>选择服务、填写模型和密钥，保存后即可开始。</span></div><a class="outline small" href="options.html#connection">前往设置 →</a></div>
<div class="editor-shell">
<div class="editor-bottom"><span id="status" role="status">最多 60,000 字符 · 不保存原文草稿</span><div class="progress-track" id="progress-track" hidden><div id="progress"></div></div><span class="spacer"></span><button id="stop" class="outline" hidden>停止</button><button id="translate" class="primary" disabled><span id="translate-label">开始翻译</span><span class="button-arrow" aria-hidden="true">↗</span></button></div>
<div class="editor-columns">
<section class="source-pane">
  <div class="pane-header"><span class="pane-title">原文</span><span class="pane-hint">自动识别语言</span><span class="spacer"></span><button id="import" class="small">导入文本 ↗</button><input type="file" id="file" accept=".txt,.md,text/plain,text/markdown" hidden><button id="clear" class="small" disabled>清空</button></div>
  <textarea id="source" aria-label="待翻译原文" placeholder="把文字放在这里。&#10;&#10;原文完整保留，译文实时展开。" spellcheck="false" maxlength="60000"></textarea>
  <div class="source-bottom"><span id="count">0 / 60,000</span></div>
</section>
<section class="target-pane" aria-label="翻译结果">
  <div class="pane-header"><label class="pane-title" for="target">译文</label><select id="target" aria-label="译文语言"></select><span class="spacer"></span><button id="copy" class="icon-button" title="复制译文" aria-label="复制译文" disabled><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/></svg></button><button id="download" class="icon-button" title="下载双语文本" aria-label="下载双语文本" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3v12m-4-4 4 4 4-4M4 15v5h16v-5"/></svg></button></div>
  <div class="target-body">
    <div id="empty" class="empty-state"><div class="empty-mark" aria-hidden="true"><span></span><span></span><span></span></div><h2>理解，会在这里发生。</h2><p>保留语气、上下文和段落，<br>让另一种语言同样好读。</p><span class="empty-shortcut"><kbd>Ctrl</kbd> <kbd>Enter</kbd><span>开始翻译</span></span></div>
    <div id="result" class="translation-result" dir="auto" hidden></div>
    <div id="error" class="translation-error" role="alert" hidden></div>
  </div>
</section>
</div>
</div>
<div class="workspace-notes"><span><i></i> 原文完整保留</span><span><i></i> 长段自动拆分</span><span class="spacer"></span><a href="options.html#connection">管理翻译服务 ↗</a></div>
</main><div id="notice" class="notice" role="status" hidden></div><script type="module" src="workspace.js"></script></body></html>
